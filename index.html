<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Torneos de Tenis Pro</title>
    <style>
        /* ESTÉTICA OSCURA Y MINIMALISTA */
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #1a1a1a;
            --border-color: #e67e22; 
            --text-color: #ffffff;
            --accent-color: #f39c12;
        }

        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        
        /* MENU DE NAVEGACIÓN */
        .navbar { background-color: #000; padding: 20px; border-bottom: 2px solid var(--border-color); display: flex; gap: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .navbar h2 { margin: 0; font-size: 18px; color: var(--accent-color); margin-right: 20px; text-transform: uppercase; letter-spacing: 1px;}
        .navbar button { background: transparent; color: #ccc; border: none; font-size: 16px; cursor: pointer; font-weight: bold; padding: 5px 10px; border-radius: 4px; transition: 0.3s; }
        .navbar button:hover, .navbar button.active { color: var(--accent-color); }

        .container { max-width: 1100px; margin: 30px auto; background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .view { display: none; }
        .view.active { display: block; }

        h1, h2, h3, h4 { color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; }
        
        /* PANELES Y TARJETAS */
        .panel { border: 1px solid #333; padding: 20px; margin-bottom: 20px; border-radius: 8px; background-color: #161616; }
        input[type="text"], select { padding: 10px; margin: 5px 0; border: 1px solid #444; border-radius: 4px; width: 100%; max-width: 300px; background: #000; color: white; }
        
        /* BOTONES */
        .btn-primary { background-color: transparent; border: 1px solid var(--border-color); color: var(--accent-color); padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        .btn-primary:hover { background-color: var(--border-color); color: white; }
        .btn-danger { background-color: #e74c3c; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .btn-success { background-color: var(--border-color); color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; width: 100%; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .btn-success:hover { background-color: #d35400; }
        
        /* TARJETAS DE TORNEOS */
        .tournaments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 15px; }
        .t-card { background-color: #161616; border: 1px solid #333; padding: 20px; border-radius: 8px; }
        .t-card.active-t { border-left: 5px solid var(--border-color); }
        .t-card.finished-t { border-left: 5px solid #555; opacity: 0.8; }
        .t-card h3 { margin-top: 0; margin-bottom: 5px; color: white; }
        .t-card p { margin: 5px 0 15px 0; font-size: 14px; color: #aaa; }

        .players-checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 15px 0; background: #000; padding: 15px; border: 1px solid #333; border-radius: 5px; }
        .player-check-item { display: flex; align-items: center; gap: 8px; font-size: 15px; color: #ddd; }

        /* TABLAS Y FIXTURES */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 15px; }
        th { background-color: #222; color: var(--accent-color); padding: 10px; border-bottom: 2px solid var(--border-color); text-align: left;}
        td { padding: 10px; border-bottom: 1px solid #333; text-align: left; }
        
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; width: 32px; text-align: center; font-weight: bold; background: #000; color: white; border: 1px solid #444; }
        
        .zone-card { border: 1px solid #333; padding: 20px; margin-top: 15px; border-radius: 8px; background-color: #111; }
        .zone-match { padding: 10px 0; border-bottom: 1px dashed #333; }
        .matchup { background-color: #1a1a1a; border: 1px solid #333; border-radius: 5px; padding: 10px; }
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #222; }
        .player-row:last-child { border-bottom: none; }
        .p-scores input:disabled { background: #111; border: 1px solid #222; opacity: 0.5; cursor: not-allowed; }
        
        /* DISEÑO DE BRACKET Y PODIO */
        .bracket-container { display: flex; flex-direction: row; background: #000; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        .bracket-round { display: flex; flex-direction: column; justify-content: space-around; margin: 0 15px; min-width: 260px; }
        .bracket-round h4 { text-align: center; color: var(--accent-color); text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .bracket-container .matchup { background-color: #111; border: 1px solid #444; color: white; margin-bottom: 15px; }
        
        /* ESTILOS DEL PODIO */
        .podium-container { background: #000; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; min-width: 250px; display: flex; flex-direction: column; justify-content: flex-end; flex: 0 0 auto; }
        .podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; height: 180px; margin-top: auto; }
        .step { display: flex; flex-direction: column; align-items: center; width: 75px; }
        .step .name { color: white; font-size: 13px; text-align: center; margin-bottom: 8px; line-height: 1.2; word-break: break-word; }
        .step .bar { width: 100%; color: #000; font-weight: bold; font-size: 14px; text-align: center; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; border-top-left-radius: 4px; border-top-right-radius: 4px; box-shadow: inset 0 2px 4px rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.1); }
        .step-1 .bar { height: 120px; background: linear-gradient(to bottom, #f1c40f, #f39c12); }
        .step-2 .bar { height: 80px; background: linear-gradient(to bottom, #bdc3c7, #95a5a6); }
        .step-3 .bar { height: 50px; background: linear-gradient(to bottom, #cd7f32, #d35400); }

        .standings-table th { background-color: #222; font-size: 12px; padding: 8px; }
        .standings-table td { padding: 8px; font-size: 12px; }
    </style>
</head>
<body>

<div class="navbar">
    <h2>🎾 Tenis Pro</h2>
    <button class="nav-btn active" onclick="switchView('view-home', this)">Inicio (Torneos)</button>
    <button class="nav-btn" onclick="switchView('view-create', this)">🏆 Crear Torneo</button>
    <button class="nav-btn" onclick="switchView('view-db', this)">👥 Base de Jugadores</button>
</div>

<div class="container">
    
    <div id="view-home" class="view active">
        <h2>Torneos Activos</h2>
        <div id="activeTournamentsGrid" class="tournaments-grid"></div>
        
        <h2 style="margin-top: 40px; border-top: 1px solid #333; padding-top: 20px;">Torneos Finalizados</h2>
        <div id="finishedTournamentsGrid" class="tournaments-grid"></div>
    </div>

    <div id="view-create" class="view">
        <h2>Crear Nuevo Torneo</h2>
        <div class="panel">
            <label><strong>Nombre del Torneo:</strong></label><br>
            <input type="text" id="tName" placeholder="Ej: Copa de Verano 2026"><br><br>
            
            <label><strong>Categoría a Jugar:</strong></label><br>
            <select id="tCategory" onchange="loadPlayersForTournament()">
                <option value="">Selecciona una Categoría...</option>
            </select><br><br>

            <div id="playerSelectionDiv" style="display: none;">
                <label><strong>Selecciona los participantes:</strong></label>
                <div class="players-checkbox-grid" id="checkboxesContainer"></div>
                <p style="font-size: 13px; color: #7f8c8d;">¿Falta alguien? <a href="#" style="color: var(--accent-color);" onclick="switchView('view-db', document.querySelectorAll('.nav-btn')[2])">Ve a la Base de Jugadores para agregarlo.</a></p>
                <button class="btn-success" onclick="generateNewTournament()">Generar Fixture y Comenzar Torneo</button>
            </div>
        </div>
    </div>

    <div id="view-db" class="view">
        <h2>Gestión de Categorías y Jugadores</h2>
        <div class="panel" style="border-color: var(--border-color);">
            <h3>Categorías</h3>
            <input type="text" id="catName" placeholder="Nueva categoría (Ej: 4ta Masculino)">
            <button class="btn-primary" onclick="addCategory()">+ Agregar Categoría</button>
            <ul id="catList" style="color: #ddd;"></ul>
        </div>

        <div class="panel">
            <h3>Inscripción en Base de Datos</h3>
            <input type="text" id="playerName" placeholder="Nombre del Jugador">
            <select id="playerCat"><option value="">Selecciona una Categoría...</option></select>
            <button class="btn-primary" onclick="addPlayer()">+ Registrar Jugador</button>
            
            <table id="playersTable">
                <thead><tr><th>Nombre</th><th>Categoría</th><th>Acción</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="view-fixture" class="view">
        <button class="btn-primary" onclick="switchView('view-home', document.querySelectorAll('.nav-btn')[0])">⬅ Volver al Inicio</button>
        <button class="btn-danger" id="btnFinishTourney" style="float: right;" onclick="markTournamentFinished()">🏁 Finalizar Torneo</button>
        
        <h1 id="activeTournamentTitle" style="text-align: center; color: var(--accent-color); margin-top: 30px;"></h1>
        <div id="fixtureContainer"></div>
    </div>

</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxQknJzexEiLc1wAjbonnmBXHxBM3dPWm19jHTQX96VGBIuT_GYybCrO-ilhCV7jjYG/exec';
    
    let categories = [];
    let players = [];
    let tournaments = [];
    let activeTournament = null; 

    function switchView(viewId, btnElement) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        
        if(btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        if (viewId === 'view-home') renderDashboard();
    }

    function addCategory() {
        const catName = document.getElementById('catName').value.trim();
        if (catName && !categories.includes(catName)) {
            categories.push(catName); document.getElementById('catName').value = ''; updateUI();
        }
    }
    function removeCategory(cat) {
        if (confirm(`¿Eliminar la categoría "${cat}"?`)) {
            categories = categories.filter(c => c !== cat); players = players.filter(p => p.category !== cat); updateUI();
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'deleteCategory', category: cat }) });
        }
    }
    function addPlayer() {
        const name = document.getElementById('playerName').value.trim(); const cat = document.getElementById('playerCat').value;
        if (name && cat) {
            const newPlayer = { id: Date.now(), name: name, category: cat };
            players.push(newPlayer); document.getElementById('playerName').value = ''; updateUI();
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'add', id: newPlayer.id, name: newPlayer.name, category: newPlayer.category }) });
        } else { alert("Completa el nombre y selecciona la categoría."); }
    }
    function removePlayer(id) {
        if (confirm(`¿Deseas eliminar a este jugador?`)) {
            players = players.filter(p => p.id !== id); updateUI();
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'deletePlayer', id: id }) });
        }
    }
    function updateUI() {
        const catList = document.getElementById('catList'); const playerCatSelect = document.getElementById('playerCat'); const tCategorySelect = document.getElementById('tCategory');
        catList.innerHTML = ''; playerCatSelect.innerHTML = '<option value="">Selecciona una Categoría...</option>'; tCategorySelect.innerHTML = '<option value="">Selecciona una Categoría...</option>';
        categories.forEach(cat => {
            catList.innerHTML += `<li style="margin-bottom: 8px;">${cat} <button class="btn-danger" style="padding: 2px 6px; font-size:10px; margin-left: 10px;" onclick="removeCategory('${cat}')">X</button></li>`;
            playerCatSelect.innerHTML += `<option value="${cat}">${cat}</option>`; tCategorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
        const tbody = document.querySelector('#playersTable tbody'); tbody.innerHTML = '';
        players.forEach(p => { tbody.innerHTML += `<tr><td>${p.name}</td><td>${p.category}</td><td><button class="btn-danger" onclick="removePlayer(${p.id})">Eliminar</button></td></tr>`; });
    }

    function loadPlayersForTournament() {
        const cat = document.getElementById('tCategory').value; const div = document.getElementById('playerSelectionDiv'); const container = document.getElementById('checkboxesContainer');
        container.innerHTML = ''; if (!cat) { div.style.display = 'none'; return; }
        let catPlayers = players.filter(p => p.category === cat);
        if(catPlayers.length === 0) { container.innerHTML = '<p style="color:#e74c3c;">No hay jugadores registrados.</p>'; } 
        else { catPlayers.forEach(p => { container.innerHTML += `<label class="player-check-item"><input type="checkbox" value="${p.name}" class="tourney-player-cb" checked> ${p.name}</label>`; }); }
        div.style.display = 'block';
    }

    function generateNewTournament() {
        const tName = document.getElementById('tName').value.trim(); const cat = document.getElementById('tCategory').value;
        const checkboxes = document.querySelectorAll('.tourney-player-cb:checked');
        if(!tName) { alert("Ponle un nombre al torneo."); return; }
        if(checkboxes.length < 3) { alert("Necesitas al menos 3 jugadores."); return; }

        let selectedPlayers = Array.from(checkboxes).map(cb => cb.value).sort(() => Math.random() - 0.5);
        let fixturesObj = { zones: [], knockout: [] }; let zonaCount = 1; let cleanCatId = cat.replace(/\s+/g, '');

        while (selectedPlayers.length > 0) {
            let size = (selectedPlayers.length === 3 || selectedPlayers.length === 5 || selectedPlayers.length === 6) && selectedPlayers.length < 4 ? 3 : 4;
            if(selectedPlayers.length < 3) size = selectedPlayers.length;
            let zonePlayers = selectedPlayers.splice(0, size); let matches = [];
            for (let i = 0; i < zonePlayers.length; i++) {
                for (let j = i + 1; j < zonePlayers.length; j++) {
                    matches.push({ id: `${cleanCatId}-Z${zonaCount}-M${i}-${j}`, p1: zonePlayers[i], p2: zonePlayers[j], scores: { s1p1: '', s2p1: '', s3p1: '', s1p2: '', s2p2: '', s3p2: '' } });
                }
            }
            fixturesObj.zones.push({ name: `Zona ${zonaCount}`, players: zonePlayers, matches: matches }); zonaCount++;
        }

        let totalZonas = zonaCount - 1;
        if (totalZonas === 1) {
            fixturesObj.knockout.push({ id: `${cleanCatId}-KO-F`, round: 'Final', p1Placeholder: '1-Z1', p2Placeholder: '2-Z1', p1: '1ro Zona 1', p2: '2do Zona 1', scores: {s1p1:'',s2p1:'',s3p1:'',s1p2:'',s2p2:'',s3p2:''} });
        } else if (totalZ
