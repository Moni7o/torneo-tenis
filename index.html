<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Torneos de Tenis Pro</title>
    <style>
        /* ESTÉTICA OSCURA Y MINIMALISTA */
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #1a1a1a;
            --border-color: #e67e22; 
            --text-color: #ffffff;
            --accent-color: #f39c12;
        }

        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        
        /* MENU DE NAVEGACIÓN */
        .navbar { background-color: #000; padding: 20px; border-bottom: 2px solid var(--border-color); display: flex; gap: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .navbar h2 { margin: 0; font-size: 18px; color: var(--accent-color); margin-right: 20px; text-transform: uppercase; letter-spacing: 1px;}
        .navbar button { background: transparent; color: #ccc; border: none; font-size: 16px; cursor: pointer; font-weight: bold; padding: 5px 10px; border-radius: 4px; transition: 0.3s; }
        .navbar button:hover, .navbar button.active { color: var(--accent-color); }

        .container { max-width: 1100px; margin: 30px auto; background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .view { display: none; }
        .view.active { display: block; }

        h1, h2, h3, h4 { color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; }
        
        /* PANELES Y TARJETAS */
        .panel { border: 1px solid #333; padding: 20px; margin-bottom: 20px; border-radius: 8px; background-color: #161616; }
        input[type="text"], select { padding: 10px; margin: 5px 0; border: 1px solid #444; border-radius: 4px; width: 100%; max-width: 300px; background: #000; color: white; }
        
        /* BOTONES */
        .btn-primary { background-color: transparent; border: 1px solid var(--border-color); color: var(--accent-color); padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        .btn-primary:hover { background-color: var(--border-color); color: white; }
        .btn-danger { background-color: #e74c3c; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .btn-success { background-color: var(--border-color); color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; width: 100%; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .btn-success:hover { background-color: #d35400; }
        
        /* TARJETAS DE TORNEOS */
        .tournaments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 15px; }
        .t-card { background-color: #161616; border: 1px solid #333; padding: 20px; border-radius: 8px; }
        .t-card.active-t { border-left: 5px solid var(--border-color); }
        .t-card.finished-t { border-left: 5px solid #555; opacity: 0.8; }
        .t-card h3 { margin-top: 0; margin-bottom: 5px; color: white; }
        .t-card p { margin: 5px 0 15px 0; font-size: 14px; color: #aaa; }

        .players-checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 15px 0; background: #000; padding: 15px; border: 1px solid #333; border-radius: 5px; }
        .player-check-item { display: flex; align-items: center; gap: 8px; font-size: 15px; color: #ddd; }

        /* TABLAS Y FIXTURES */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 15px; }
        th { background-color: #222; color: var(--accent-color); padding: 10px; border-bottom: 2px solid var(--border-color); text-align: left;}
        td { padding: 10px; border-bottom: 1px solid #333; text-align: left; }
        
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; width: 32px; text-align: center; font-weight: bold; background: #000; color: white; border: 1px solid #444; }
        
        .zone-card { border: 1px solid #333; padding: 20px; margin-top: 15px; border-radius: 8px; background-color: #111; }
        .zone-match { padding: 10px 0; border-bottom: 1px dashed #333; }
        .matchup { background-color: #1a1a1a; border: 1px solid #333; border-radius: 5px; padding: 10px; }
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #222; }
        .player-row:last-child { border-bottom: none; }
        .p-scores input:disabled { background: #111; border: 1px solid #222; opacity: 0.5; }
        
        /* DISEÑO DE BRACKET Y PODIO */
        .bracket-container { display: flex; flex-direction: row; background: #000; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        .bracket-round { display: flex; flex-direction: column; justify-content: space-around; margin: 0 15px; min-width: 260px; }
        .bracket-round h4 { text-align: center; color: var(--accent-color); text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .bracket-container .matchup { background-color: #111; border: 1px solid #444; color: white; margin-bottom: 15px; }
        
        /* ESTILOS DEL PODIO */
        .podium-container { background: #000; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; min-width: 250px; display: flex; flex-direction: column; justify-content: flex-end; flex: 0 0 auto; }
        .podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; height: 180px; margin-top: auto; }
        .step { display: flex; flex-direction: column; align-items: center; width: 75px; }
        .step .name { color: white; font-size: 13px; text-align: center; margin-bottom: 8px; line-height: 1.2; word-break: break-word; }
        .step .bar { width: 100%; color: #000; font-weight: bold; font-size: 14px; text-align: center; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; border-top-left-radius: 4px; border-top-right-radius: 4px; box-shadow: inset 0 2px 4px rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.1); }
        .step-1 .bar { height: 120px; background: linear-gradient(to bottom, #f1c40f, #f39c12); }
        .step-2 .bar { height: 80px; background: linear-gradient(to bottom, #bdc3c7, #95a5a6); }
        .step-3 .bar { height: 50px; background: linear-gradient(to bottom, #cd7f32, #d35400); }

        .standings-table th { background-color: #222; font-size: 12px; padding: 8px; }
        .standings-table td { padding: 8px; font-size: 12px; }
    </style>
</head>
<body>

<div class="navbar">
    <h2>🎾 Tenis Pro</h2>
    <button class="nav-btn active" onclick="switchView('view-home', this)">Inicio (Torneos)</button>
    <button class="nav-btn" onclick="switchView('view-create', this)">🏆 Crear Torneo</button>
    <button class="nav-btn" onclick="switchView('view-db', this)">👥 Base de Jugadores</button>
</div>

<div class="container">
    
    <div id="view-home" class="view active">
        <h2>Torneos Activos</h2>
        <div id="activeTournamentsGrid" class="tournaments-grid"></div>
        
        <h2 style="margin-top: 40px; border-top: 1px solid #333; padding-top: 20px;">Torneos Finalizados</h2>
        <div id="finishedTournamentsGrid" class="tournaments-grid"></div>
    </div>

    <div id="view-create" class="view">
        <h2>Crear Nuevo Torneo</h2>
        <div class="panel">
            <label><strong>Nombre del Torneo:</strong></label><br>
            <input type="text" id="tName" placeholder="Ej: Copa de Verano 2026"><br><br>
            
            <label><strong>Categoría a Jugar:</strong></label><br>
            <select id="tCategory" onchange="loadPlayersForTournament()">
                <option value="">Selecciona una Categoría...</option>
            </select><br><br>

            <div id="playerSelectionDiv" style="display: none;">
                <label><strong>Selecciona los participantes:</strong></label>
                <div class="players-checkbox-grid" id="checkboxesContainer"></div>
                <p style="font-size: 13px; color: #7f8c8d;">¿Falta alguien? <a href="#" style="color: var(--accent-color);" onclick="switchView('view-db', document.querySelectorAll('.nav-btn')[2])">Ve a la Base de Jugadores para agregarlo.</a></p>
                <button class="btn-success" onclick="generateNewTournament()">Generar Fixture y Comenzar Torneo</button>
            </div>
        </div>
    </div>

    <div id="view-db" class="view">
        <h2>Gestión de Categorías y Jugadores</h2>
        <div class="panel" style="border-color: var(--border-color);">
            <h3>Categorías</h3>
            <input type="text" id="catName" placeholder="Nueva categoría (Ej: 4ta Masculino)">
            <button class="btn-primary" onclick="addCategory()">+ Agregar Categoría</button>
            <ul id="catList" style="color: #ddd;"></ul>
        </div>

        <div class="panel">
            <h3>Inscripción en Base de Datos</h3>
            <input type="text" id="playerName" placeholder="Nombre del Jugador">
            <select id="playerCat"><option value="">Selecciona una Categoría...</option></select>
            <button class="btn-primary" onclick="addPlayer()">+ Registrar Jugador</button>
            
            <table id="playersTable">
                <thead><tr><th>Nombre</th><th>Categoría</th><th>Acción</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="view-fixture" class="view">
        <button class="btn-primary" onclick="switchView('view-home', document.querySelectorAll('.nav-btn')[0])">⬅ Volver al Inicio</button>
        <button class="btn-danger" id="btnFinishTourney" style="float: right;" onclick="markTournamentFinished()">🏁 Finalizar Torneo</button>
        
        <h1 id="activeTournamentTitle" style="text-align: center; color: var(--accent-color); margin-top: 30px;"></h1>
        <div id="fixtureContainer"></div>
    </div>

</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxQknJzexEiLc1wAjbonnmBXHxBM3dPWm19jHTQX96VGBIuT_GYybCrO-ilhCV7jjYG/exec';
    
    let categories = [];
    let players = [];
    let tournaments = [];
    let activeTournament = null; 

    function switchView(viewId, btnElement) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        
        if(btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        if (viewId === 'view-home') renderDashboard();
    }

    function addCategory() {
        const catName = document.getElementById('catName').value.trim();
        if (catName && !categories.includes(catName)) {
            categories.push(catName); document.getElementById('catName').value = ''; updateUI();
        }
    }
    function removeCategory(cat) {
        if (confirm(`¿Eliminar la categoría "${cat}"?`)) {
            categories = categories.filter(c => c !== cat); players = players.filter(p => p.category !== cat); updateUI();
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'deleteCategory', category: cat }) });
        }
    }
    function addPlayer() {
        const name = document.getElementById('playerName').value.trim(); const cat = document.getElementById('playerCat').value;
        if (name && cat) {
            const newPlayer = { id: Date.now(), name: name, category: cat };
            players.push(newPlayer); document.getElementById('playerName').value = ''; updateUI();
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'add', id: newPlayer.id, name: newPlayer.name, category: newPlayer.category }) });
        } else { alert("Completa el nombre y selecciona la categoría."); }
    }
    function removePlayer(id) {
        if (confirm(`¿Deseas eliminar a este jugador?`)) {
            players = players.filter(p => p.id !== id); updateUI();
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'deletePlayer', id: id }) });
        }
    }
    function updateUI() {
        const catList = document.getElementById('catList'); const playerCatSelect = document.getElementById('playerCat'); const tCategorySelect = document.getElementById('tCategory');
        catList.innerHTML = ''; playerCatSelect.innerHTML = '<option value="">Selecciona una Categoría...</option>'; tCategorySelect.innerHTML = '<option value="">Selecciona una Categoría...</option>';
        categories.forEach(cat => {
            catList.innerHTML += `<li style="margin-bottom: 8px;">${cat} <button class="btn-danger" style="padding: 2px 6px; font-size:10px; margin-left: 10px;" onclick="removeCategory('${cat}')">X</button></li>`;
            playerCatSelect.innerHTML += `<option value="${cat}">${cat}</option>`; tCategorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
        const tbody = document.querySelector('#playersTable tbody'); tbody.innerHTML = '';
        players.forEach(p => { tbody.innerHTML += `<tr><td>${p.name}</td><td>${p.category}</td><td><button class="btn-danger" onclick="removePlayer(${p.id})">Eliminar</button></td></tr>`; });
    }

    function loadPlayersForTournament() {
        const cat = document.getElementById('tCategory').value; const div = document.getElementById('playerSelectionDiv'); const container = document.getElementById('checkboxesContainer');
        container.innerHTML = ''; if (!cat) { div.style.display = 'none'; return; }
        let catPlayers = players.filter(p => p.category === cat);
        if(catPlayers.length === 0) { container.innerHTML = '<p style="color:#e74c3c;">No hay jugadores registrados.</p>'; } 
        else { catPlayers.forEach(p => { container.innerHTML += `<label class="player-check-item"><input type="checkbox" value="${p.name}" class="tourney-player-cb" checked> ${p.name}</label>`; }); }
        div.style.display = 'block';
    }

    function generateNewTournament() {
        const tName = document.getElementById('tName').value.trim(); const cat = document.getElementById('tCategory').value;
        const checkboxes = document.querySelectorAll('.tourney-player-cb:checked');
        if(!tName) { alert("Ponle un nombre al torneo."); return; }
        if(checkboxes.length < 3) { alert("Necesitas al menos 3 jugadores."); return; }

        let selectedPlayers = Array.from(checkboxes).map(cb => cb.value).sort(() => Math.random() - 0.5);
        let fixturesObj = { zones: [], knockout: [] }; let zonaCount = 1; let cleanCatId = cat.replace(/\s+/g, '');

        while (selectedPlayers.length > 0) {
            let size = (selectedPlayers.length === 3 || selectedPlayers.length === 5 || selectedPlayers.length === 6) && selectedPlayers.length < 4 ? 3 : 4;
            if(selectedPlayers.length < 3) size = selectedPlayers.length;
            let zonePlayers = selectedPlayers.splice(0, size); let matches = [];
            for (let i = 0; i < zonePlayers.length; i++) {
                for (let j = i + 1; j < zonePlayers.length; j++) {
                    matches.push({ id: `${cleanCatId}-Z${zonaCount}-M${i}-${j}`, p1: zonePlayers[i], p2: zonePlayers[j], scores: { s1p1: '', s2p1: '', s3p1: '', s1p2: '', s2p2: '', s3p2: '' } });
                }
            }
            fixturesObj.zones.push({ name: `Zona ${zonaCount}`, players: zonePlayers, matches: matches }); zonaCount++;
        }

        let totalZonas = zonaCount - 1;
        if (totalZonas === 1) {
            fixturesObj.knockout.push({ id: `${cleanCatId}-KO-F`, round: 'Final', p1Placeholder: '1-Z1', p2Placeholder: '2-Z1', p1: '1ro Zona 1', p2: '2do Zona 1', scores: {s1p1:'',s2p1:'',s3p1:'',s1p2:'',s2p2:'',s3p2:''} });
        } else if (totalZonas === 2) {
            fixturesObj.knockout.push({ id: `${cleanCatId}-KO-S1`, round: 'Semifinales', p1Placeholder: '1-Z1', p2Placeholder: '2-Z2', p1: '1ro Zona 1', p2: '2do Zona 2', scores: {s1p1:'',s2p1:'',s3p1:'',s1p2:'',s2p2:'',s3p2:''} });
            fixturesObj.knockout.push({ id: `${cleanCatId}-KO-S2`, round: 'Semifinales', p1Placeholder: '1-Z2', p2Placeholder: '2-Z1', p1: '1ro Zona 2', p2: '2do Zona 1', scores: {s1p1:'',s2p1:'',s3p1:'',s1p2:'',s2p2:'',s3p2:''} });
            fixturesObj.knockout.push({ id: `${cleanCatId}-KO-F`, round: 'Final', p1Placeholder: 'W-S1', p2Placeholder: 'W-S2', p1: 'Ganador Semi 1', p2: 'Ganador Semi 2', scores: {s1p1:'',s2p1:'',s3p1:'',s1p2:'',s2p2:'',s3p2:''} });
        } else {
            for (let k = 1; k <= 4; k++) { fixturesObj.knockout.push({ id: `${cleanCatId}-KO-C${k}`, round: 'Cuartos de Final', p1Placeholder: `1-Z${k}`, p2Placeholder: k===1?'BEST-2':k===2?'2-Z3':k===3?'2-Z2':'2-Z1', p1: `1ro Zona ${k}`, p2: k===1?'Mejor 2do':`2do Zona ${5-k}`, scores: {s1p1:'',s2p1:'',s3p1:'',s1p2:'',s2p2:'',s3p2:''} }); }
            fixturesObj.knockout.push({ id: `${cleanCatId}-KO-S1`, round: 'Semifinales', p1Placeholder: 'W-C1', p2Placeholder: 'W-C2', p1: 'Ganador C1', p2: 'Ganador C2', scores: {s1p1:'',s2p1:'',s3p1:'',s1p2:'',s2p2:'',s3p2:''} });
            fixturesObj.knockout.push({ id: `${cleanCatId}-KO-S2`, round: 'Semifinales', p1Placeholder: 'W-C3', p2Placeholder: 'W-C4', p1: 'Ganador C3', p2: 'Ganador C4', scores: {s1p1:'',s2p1:'',s3p1:'',s1p2:'',s2p2:'',s3p2:''} });
            fixturesObj.knockout.push({ id: `${cleanCatId}-KO-F`, round: 'Final', p1Placeholder: 'W-S1', p2Placeholder: 'W-S2', p1: 'Ganador Semi 1', p2: 'Ganador Semi 2', scores: {s1p1:'',s2p1:'',s3p1:'',s1p2:'',s2p2:'',s3p2:''} });
        }

        const newTournament = { id: Date.now().toString(), name: `${tName} - ${cat}`, status: 'Activo', date: new Date().toLocaleDateString(), fixtures: fixturesObj };
        tournaments.push(newTournament); syncTournamentToCloud(newTournament);
        document.getElementById('tName').value = ''; document.getElementById('playerSelectionDiv').style.display = 'none';
        openTournament(newTournament.id);
    }

    // NUEVA FUNCIÓN: Limpia la fecha para mostrar solo DD/MM/AAAA
    function formatShortDate(dateStr) {
        if (!dateStr) return '';
        let d = new Date(dateStr);
        // Si el formato no es válido, devuelve el texto original
        if (isNaN(d.getTime())) return dateStr; 
        
        let dia = String(d.getDate()).padStart(2, '0');
        let mes = String(d.getMonth() + 1).padStart(2, '0');
        let anio = d.getFullYear();
        
        return `${dia}/${mes}/${anio}`;
    }

    // FUNCIÓN ACTUALIZADA: Renderiza las tarjetas con las fechas correctas
    function renderDashboard() {
        const activeGrid = document.getElementById('activeTournamentsGrid'); 
        const finishedGrid = document.getElementById('finishedTournamentsGrid');
        activeGrid.innerHTML = ''; finishedGrid.innerHTML = '';
        
        tournaments.forEach(t => {
            let dateInicio = formatShortDate(t.date);
            let dateText = '';
            
            // Lógica para mostrar las etiquetas correctas
            if (t.status === 'Activo') {
                dateText = `Fecha de inicio: ${dateInicio}`;
            } else {
                // Si es finalizado, busca la fecha de fin. Si no la tiene (torneo viejo), repite la de inicio.
                let dateFin = t.fixtures.endDate ? formatShortDate(t.fixtures.endDate) : dateInicio;
                dateText = `Inicio y fin: ${dateInicio} al ${dateFin}`;
            }

            let card = `<div class="t-card ${t.status === 'Activo' ? 'active-t' : 'finished-t'}">
                <h3>${t.name}</h3>
                <p style="margin: 5px 0 15px 0; font-size: 14px; color: #aaa;">${dateText}</p>
                <button class="btn-primary" onclick="openTournament('${t.id}')">${t.status === 'Activo' ? 'Ir a los Partidos' : 'Ver Resultados'}</button>
            </div>`;
            
            if (t.status === 'Activo') activeGrid.innerHTML += card; 
            else finishedGrid.innerHTML += card;
        });
        
        if(activeGrid.innerHTML === '') activeGrid.innerHTML = '<p style="color:#aaa;">No hay torneos activos en curso.</p>';
        if(finishedGrid.innerHTML === '') finishedGrid.innerHTML = '<p style="color:#aaa;">No hay torneos finalizados aún.</p>';
    }
    function openTournament(id) {
        activeTournament = tournaments.find(t => t.id === id); switchView('view-fixture');
        document.getElementById('activeTournamentTitle').innerText = activeTournament.name;
        document.getElementById('btnFinishTourney').style.display = activeTournament.status === 'Activo' ? 'block' : 'none';
        resolveAllNames(activeTournament); renderActiveFixture();
    }

// FUNCIÓN ACTUALIZADA: Ahora guarda el día exacto en que se finalizó el torneo
    function markTournamentFinished() {
        if(confirm("¿Declarar este torneo como Finalizado?")) {
            activeTournament.status = 'Finalizado'; 
            // Guardamos la fecha de fin dentro del JSON para no alterar las columnas de Google Sheets
            activeTournament.fixtures.endDate = new Date().toISOString();
            
            syncTournamentToCloud(activeTournament); 
            switchView('view-home', document.querySelectorAll('.nav-btn')[0]);
        }
    }

    function onScoreChange(matchId, field, value) {
        if(activeTournament.status === 'Finalizado') return;
        let match = null;
        for (let zone of activeTournament.fixtures.zones) { match = zone.matches.find(m => m.id === matchId); if (match) break; }
        if (!match) match = activeTournament.fixtures.knockout.find(m => m.id === matchId);
        if (match) {
            match.scores[field] = value; resolveAllNames(activeTournament); renderActiveFixture(); syncTournamentToCloud(activeTournament);
        }
    }

    function syncTournamentToCloud(tObj) {
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'saveTournament', torneo: tObj }) });
    }

    function getWinnerFromMatch(match) {
        const s = match.scores;
        if (s.s1p1 === '' || s.s1p2 === '' || s.s2p1 === '' || s.s2p2 === '') return null;
        let p1Sets = 0; let p2Sets = 0;
        if (parseInt(s.s1p1) > parseInt(s.s1p2)) p1Sets++; else if(parseInt(s.s1p2) > parseInt(s.s1p1)) p2Sets++;
        if (parseInt(s.s2p1) > parseInt(s.s2p2)) p1Sets++; else if(parseInt(s.s2p2) > parseInt(s.s2p1)) p2Sets++;
        if (p1Sets === 1 && p2Sets === 1) { 
            if (parseInt(s.s3p1) > parseInt(s.s3p2)) p1Sets++; else if(parseInt(s.s3p2) > parseInt(s.s3p1)) p2Sets++; 
        }
        if (p1Sets > p2Sets) return match.p1;
        if (p2Sets > p1Sets) return match.p2;
        return null;
    }

    function calculateZoneStandings(zone) {
        let stats = {}; zone.players.forEach(p => { stats[p] = { name: p, matchesWon: 0, setsWon: 0, setsLost: 0, gamesWon: 0, gamesLost: 0 }; });
        zone.matches.forEach(m => {
            const s = m.scores; if (s.s1p1 === '' || s.s1p2 === '' || s.s2p1 === '' || s.s2p2 === '') return;
            let s1p1 = parseInt(s.s1p1)||0; let s1p2 = parseInt(s.s1p2)||0; let s2p1 = parseInt(s.s2p1)||0; let s2p2 = parseInt(s.s2p2)||0; let s3p1 = parseInt(s.s3p1)||0; let s3p2 = parseInt(s.s3p2)||0;
            let p1Sets = 0; let p2Sets = 0; let p1Games = s1p1+s2p1; let p2Games = s1p2+s2p2;
            if (s1p1 > s1p2) p1Sets++; else if (s1p2 > s1p1) p2Sets++;
            if (s2p1 > s2p2) p1Sets++; else if (s2p2 > s2p1) p2Sets++;
            if (p1Sets === 1 && p2Sets === 1) { p1Games += s3p1; p2Games += s3p2; if (s3p1 > s3p2) p1Sets++; else if (s3p2 > s3p1) p2Sets++; }
            stats[m.p1].setsWon += p1Sets; stats[m.p1].setsLost += p2Sets; stats[m.p1].gamesWon += p1Games; stats[m.p1].gamesLost += p2Games;
            stats[m.p2].setsWon += p2Sets; stats[m.p2].setsLost += p1Sets; stats[m.p2].gamesWon += p2Games; stats[m.p2].gamesLost += p1Games;
            if (p1Sets > p2Sets) stats[m.p1].matchesWon++; else if (p2Sets > p1Sets) stats[m.p2].matchesWon++;
        });
        return Object.values(stats).sort((a, b) => {
            if (b.matchesWon !== a.matchesWon) return b.matchesWon - a.matchesWon;
            let diffSetsA = a.setsWon - a.setsLost; let diffSetsB = b.setsWon - b.setsLost;
            if (diffSetsB !== diffSetsA) return diffSetsB - diffSetsA; return (b.gamesWon - b.gamesLost) - (a.gamesWon - a.gamesLost);
        });
    }

    function resolveAllNames(tObj) {
        let zoneResults = {}; let allSecondPlaces = [];
        tObj.fixtures.zones.forEach((zone, idx) => {
            let standings = calculateZoneStandings(zone); zoneResults[`Zona ${idx+1}`] = standings;
            if (standings.length > 1) allSecondPlaces.push(standings[1]);
        });
        allSecondPlaces.sort((a, b) => {
            if (b.matchesWon !== a.matchesWon) return b.matchesWon - a.matchesWon;
            if ((b.setsWon-b.setsLost) !== (a.setsWon-a.setsLost)) return (b.setsWon-b.setsLost) - (a.setsWon-a.setsLost);
            return (b.gamesWon-b.gamesLost) - (a.gamesWon-a.gamesLost);
        });
        let bestSecond = allSecondPlaces[0] ? allSecondPlaces[0].name : 'Mejor 2do';

        function getNameFromPlaceholder(pl) {
            if (pl.includes('-Z')) {
                let parts = pl.split('-Z'); let rank = parseInt(parts[0]); let zIdx = parseInt(parts[1]);
                let standings = zoneResults[`Zona ${zIdx}`];
                if (standings && standings[rank - 1]) return standings[rank - 1].name;
                return rank === 1 ? `1ro Zona ${zIdx}` : `2do Zona ${zIdx}`;
            }
            if (pl === 'BEST-2') return bestSecond;
            if (pl.startsWith('W-C') || pl.startsWith('W-S')) {
                let code = pl.replace('W-', ''); let match = tObj.fixtures.knockout.find(m => m.id.includes(`-KO-${code}`));
                if (match) return getWinnerFromMatch(match) || `Ganador ${code}`;
                return `Ganador ${code}`;
            }
            return pl;
        }

        ['Cuartos de Final', 'Semifinales', 'Final'].forEach(round => {
            tObj.fixtures.knockout.forEach(match => {
                if (match.round === round) { match.p1 = getNameFromPlaceholder(match.p1Placeholder); match.p2 = getNameFromPlaceholder(match.p2Placeholder); }
            });
        });
    }

    function createMatchBlock(match, isFinished) {
        const s = match.scores; const disabled = isFinished ? "disabled" : "";
        return `
        <div class="matchup" data-id="${match.id}">
            <div class="player-row"><span class="p-name">${match.p1}</span>
                <div class="p-scores">
                    <input type="number" class="s1p1" value="${s.s1p1}" onchange="onScoreChange('${match.id}','s1p1',this.value)" ${disabled}>
                    <input type="number" class="s2p1" value="${s.s2p1}" onchange="onScoreChange('${match.id}','s2p1',this.value)" ${disabled}>
                    <input type="number" class="s3p1" value="${s.s3p1}" onchange="onScoreChange('${match.id}','s3p1',this.value)" ${disabled}>
                </div>
            </div>
            <div class="player-row"><span class="p-name">${match.p2}</span>
                <div class="p-scores">
                    <input type="number" class="s1p2" value="${s.s1p2}" onchange="onScoreChange('${match.id}','s1p2',this.value)" ${disabled}>
                    <input type="number" class="s2p2" value="${s.s2p2}" onchange="onScoreChange('${match.id}','s2p2',this.value)" ${disabled}>
                    <input type="number" class="s3p2" value="${s.s3p2}" onchange="onScoreChange('${match.id}','s3p2',this.value)" ${disabled}>
                </div>
            </div>
        </div>`;
    }

    function renderActiveFixture() {
        const container = document.getElementById('fixtureContainer'); container.innerHTML = '';
        let isFinished = activeTournament.status === 'Finalizado';

        activeTournament.fixtures.zones.forEach(zone => {
            let zoneHTML = `<div class="zone-card"><h4>${zone.name}</h4>`;
            let standings = calculateZoneStandings(zone);
            let tableHTML = `<table class="standings-table"><thead><tr><th>Pos</th><th>Jugador</th><th>PG</th><th>Dif Sets</th><th>Dif Games</th></tr></thead><tbody>`;
            standings.forEach((st, i) => {
                let dS = st.setsWon - st.setsLost; let dG = st.gamesWon - st.gamesLost;
                tableHTML += `<tr><td><strong>${i+1}°</strong></td><td><strong style="color:white;">${st.name}</strong></td><td>${st.matchesWon}</td><td>${dS >= 0 ? '+'+dS : dS}</td><td>${dG >= 0 ? '+'+dG : dG}</td></tr>`;
            });
            tableHTML += `</tbody></table><strong style="color:var(--accent-color);">Partidos:</strong><br>`;
            zone.matches.forEach((match, idx) => { zoneHTML += `<div class="zone-match"><div class="match-header" style="color:#aaa;">Partido ${idx + 1}</div>${createMatchBlock(match, isFinished)}</div>`; });
            container.innerHTML += zoneHTML + `</div>`;
        });

        let knockoutHTML = `<div class="knockout-card">
                                <h3 style="margin-top:40px;">🔥 Fase Eliminatoria</h3>
                                <div style="display: flex; flex-wrap: wrap; gap: 20px;">
                                    <div class="bracket-container" style="flex: 1; overflow-x: auto;">`;
        
        let rounds = {};
        activeTournament.fixtures.knockout.forEach(match => {
            if (!rounds[match.round]) rounds[match.round] = []; rounds[match.round].push(match);
        });
        
        ['Cuartos de Final', 'Semifinales', 'Final'].forEach(roundName => {
            if (rounds[roundName]) {
                knockoutHTML += `<div class="bracket-round"><h4>${roundName}</h4>`;
                rounds[roundName].forEach(match => { knockoutHTML += createMatchBlock(match, isFinished); });
                knockoutHTML += `</div>`;
            }
        });
        
        knockoutHTML += `</div>`; 

        let champ = "---", runnerUp = "---", third = "---";
        let finalMatch = activeTournament.fixtures.knockout.find(m => m.round === 'Final');
        if (finalMatch) {
            let w = getWinnerFromMatch(finalMatch);
            if (w) { champ = w; runnerUp = (w === finalMatch.p1) ? finalMatch.p2 : finalMatch.p1; }
        }
        
        let semiMatches = activeTournament.fixtures.knockout.filter(m => m.round === 'Semifinales');
        if (semiMatches.length > 0) {
            let semiLosers = [];
            semiMatches.forEach(sm => { let w = getWinnerFromMatch(sm); if (w) semiLosers.push(w === sm.p1 ? sm.p2 : sm.p1); });
            if (semiLosers.length > 0) third = semiLosers.join(" / ");
        }

        knockoutHTML += `
            <div class="podium-container">
                <h4 style="text-align:center; color:var(--accent-color); border-bottom: 1px solid var(--border-color); padding-bottom:5px; margin-top:0;">🏆 PODIO</h4>
                <div class="podium">
                    <div class="step step-2">
                        <div class="name">${runnerUp}</div>
                        <div class="bar">🥈 2°</div>
                    </div>
                    <div class="step step-1">
                        <div class="name" style="font-weight:bold; color:#f1c40f;">${champ}</div>
                        <div class="bar">🥇 1°</div>
                    </div>
                    <div class="step step-3">
                        <div class="name" style="font-size:11px;">${third}</div>
                        <div class="bar">🥉 3°</div>
                    </div>
                </div>
            </div>
        </div></div>`;

        container.innerHTML += knockoutHTML;
        document.querySelectorAll('.matchup').forEach(m => updateSetStatusVisual(m));
    }

    function updateSetStatusVisual(matchup) {
        const s1p1 = matchup.querySelector('.s1p1').value; const s1p2 = matchup.querySelector('.s1p2').value;
        const s2p1 = matchup.querySelector('.s2p1').value; const s2p2 = matchup.querySelector('.s2p2').value;
        const s3p1 = matchup.querySelector('.s3p1'); const s3p2 = matchup.querySelector('.s3p2');
        if (s1p1 !== "" && s1p2 !== "" && s2p1 !== "" && s2p2 !== "" && activeTournament.status !== 'Finalizado') {
            const p1W1 = parseInt(s1p1)>parseInt(s1p2); const p2W1 = parseInt(s1p2)>parseInt(s1p1);
            const p1W2 = parseInt(s2p1)>parseInt(s2p2); const p2W2 = parseInt(s2p2)>parseInt(s2p1);
            if ((p1W1 && p1W2) || (p2W1 && p2W2)) { s3p1.disabled = true; s3p2.disabled = true; } 
            else { s3p1.disabled = false; s3p2.disabled = false; }
        }
    }

    window.onload = () => {
        document.getElementById('activeTournamentsGrid').innerHTML = '<p style="color:#aaa;">Conectando con la base de datos...</p>';
        fetch(scriptURL)
            .then(res => res.json())
            .then(data => {
                players = data.players || []; tournaments = data.tournaments || [];
                players.forEach(p => { if(!categories.includes(p.category)) categories.push(p.category); });
                updateUI(); renderDashboard();
            })
            .catch(err => { document.getElementById('activeTournamentsGrid').innerHTML = '<p style="color:#e74c3c;">Error de conexión con Google Sheets.</p>'; });
    };
</script>
